name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + test deps
        run: python -m pip install -e . pytest
      - name: Run unit tests
        run: python -m pytest -v
      - name: Smoke-test installed console script against a real sample profile
        run: |
          mkdir -p /tmp/sample-connections
          cat > /tmp/sample-connections/eth0.nmconnection <<'EOF'
          [connection]
          id=WiredStatic
          uuid=11111111-2222-3333-4444-555555555555
          type=ethernet

          [ethernet]
          mac-address=11:22:33:44:55:66

          [ipv4]
          method=auto
          EOF
          nm-portable --version
          nm-portable --help
          nm-portable audit /tmp/sample-connections --json > /tmp/audit.json || true
          python -m json.tool < /tmp/audit.json > /dev/null
          nm-portable fix /tmp/sample-connections --out /tmp/portable-out
          ! grep -q "mac-address" /tmp/portable-out/eth0.nmconnection

  build-artifact:
    name: Build .pyz + sdist/wheel and smoke-test on Linux
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel + sdist
        run: |
          python -m pip install build
          python -m build
      - name: Build a standalone .pyz (zipapp)
        run: |
          python -m pip install . --target build/pyz_root
          printf 'from nm_portable.cli import main\nif __name__ == "__main__":\n    raise SystemExit(main())\n' > build/pyz_root/__main__.py
          python -m zipapp build/pyz_root \
            --output dist/nm-portable.pyz \
            --python "/usr/bin/env python3"
      - name: Smoke-test the .pyz on this Linux runner
        run: |
          python3 dist/nm-portable.pyz --version
          mkdir -p /tmp/sample2
          printf '[connection]\nid=x\ntype=ethernet\n[ethernet]\nmac-address=AA:AA:AA:AA:AA:AA\n[ipv4]\nmethod=auto\n' > /tmp/sample2/x.nmconnection
          python3 dist/nm-portable.pyz audit /tmp/sample2 --json > /tmp/audit.json || true
          python3 -m json.tool < /tmp/audit.json > /dev/null
          # Regression check: the .pyz's exit code must reflect the real
          # command result, not always be 0 (zipapp's --main template
          # omits sys.exit(), which previously made every .pyz invocation
          # report success regardless of actual findings/errors).
          python3 dist/nm-portable.pyz audit /tmp/sample2 > /dev/null; test $? -eq 1
      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
